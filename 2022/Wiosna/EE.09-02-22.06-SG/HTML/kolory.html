<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomocnik CSS</title>
    <link rel="stylesheet" href="../CSS/styl2.css">
</head>
<body>
    <header>
        <section id="Blok_banera_1">
            <h1>Pomocnik CSS</h1>
        </section>
        <section id="Blok_banera_2">
            <ul>
                <li><a href="kolory.html">Kolory</a></li>
                <li><a href="czcionki.html">Czcionki</a></li>
                <li><a href="style.html">Style CSS</a></li>
                <li><a href="https://www.w3schools.com/css/" target="_blank">Pomoc</a></li>
            </ul>
        </section>
    </header>
    <main>
        <h2>Podaj składową H koloru w kodzie HSL</h2>
        <p>0 do 30 czerwienie, do 60 żółcie, do 150 zielenie, do 250 niebieskie, do 360 fiolet i purpura</p>
        <img src="../Grafiki/kolory.jpg" alt="Przestrzeń barw HSL"><br>
        <input type="number" name="" id="H" placeholder="0 - 360" max="360">
        <input type="submit" value="Generuj paletę" id="Przycisk_generuj_palete">
        <table>
            <tr>
                <td colspan="4">Kolor główny</td>
            </tr>
            <tr>
                <td>kolor 2</td>
                <td>kolor 3</td>
                <td>kolor 4</td>
                <td>kolor 5</td>
            </tr>
        </table>
    </main>
    <footer>
        <p>Autor: Bartek Piechnik 3Tpa</p>
    </footer>
    <script>
        var Przycisk_generuj_palete = document.getElementById('Przycisk_generuj_palete');

        Przycisk_generuj_palete.addEventListener("click", function() {
            var H = document.getElementById('H').value;
            var Wiersz = document.querySelectorAll("td");

            for (var i = 0; i < Wiersze.length; i++)
            {
                if (i == 0)
                {
                    Wiersz[i].style.backgroundColor = "hsl(" + H + ", 100%, 50%)"; 
                }
                else if (i == 1)
                {
                    Wiersz[i].style.backgroundColor = "hsl(" + H + ", 80%, 50%)"; 
                }
                else if (i == 2)
                {
                    Wiersz[i].style.backgroundColor = "hsl(" + H + ", 60%, 50%)"; 
                }
                else if (i == 3)
                {
                    Wiersz[i].style.backgroundColor = "hsl(" + H + ", 40%, 50%)"; 
                }
                else 
                {
                    Wiersz[i].style.backgroundColor = "hsl(" + H + ", 20%, 50%)"; 
                }
            }
        });
    </script>
</body>
</html>
